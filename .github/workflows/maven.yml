name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 4" # catch SNAPSHOT breaking changes
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        jdk: ['21', '25']
        distribution: ['temurin']
        experimental: [false]
        # include:
        #   - jdk: '23'
        #     distribution: 'zulu'
        #     experimental: true
        #   - jdk: '24-ea'
        #     distribution: 'zulu'
        #     experimental: true
    continue-on-error: ${{ matrix.experimental }}
    
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.jdk }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 16
          registry-url: https://registry.npmjs.org/
      
      - name: Install newman
        run: npm install -g newman 
      
      - name: 'Build :: Bugzilla adaptor'
        run: |
          mvn -B clean verify --file adaptor-bugzilla/pom.xml
      
      - name: Build and start stack
        run: docker compose up --build -d
      - name: Wait for services
        run: |
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://localhost:8000/ >/dev/null && curl --fail --silent http://localhost:8180/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Run Postman tests
        run: |
          newman run ./test/Bugzilla.postman_collection.json
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --remove-orphans
