name: Container images

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - context: adaptor-bugzilla
            image: lyo-adaptor-bugzilla
          - context: bugzilla-server
            image: lyo-adaptor-bugzilla-backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: matrix.context == 'adaptor-bugzilla'
        with:
          distribution: temurin
          java-version: '21'
      - name: Package WAR
        if: matrix.context == 'adaptor-bugzilla'
        run: mvn -B --no-transfer-progress clean package --file adaptor-bugzilla/pom.xml
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: false

  publish:
    name: Publish ${{ matrix.image }}
    if: github.repository == 'OSLC/lyo-adaptor-bugzilla' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # Push the two trusted default-branch images to GHCR.
    strategy:
      matrix:
        include:
          - context: adaptor-bugzilla
            image: lyo-adaptor-bugzilla
          - context: bugzilla-server
            image: lyo-adaptor-bugzilla-backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: matrix.context == 'adaptor-bugzilla'
        with:
          distribution: temurin
          java-version: '21'
      - name: Package WAR
        if: matrix.context == 'adaptor-bugzilla'
        run: mvn -B --no-transfer-progress clean package --file adaptor-bugzilla/pom.xml
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/oslc/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
